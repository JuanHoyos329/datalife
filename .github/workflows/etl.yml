# ETL programado: cada 15 minutos lee Google Sheets y actualiza la base en la nube.
name: ETL Google Sheets a base de datos

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  etl:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Correr ETL
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$GOOGLE_SHEET_ID" ]; then
            echo "Faltan secretos (DATABASE_URL, GOOGLE_SHEET_ID, GOOGLE_SERVICE_ACCOUNT_JSON). Ver README."; exit 0
          fi
          python -m etl.etl_personas
