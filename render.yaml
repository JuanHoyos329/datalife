# Blueprint de Render: crea la base PostgreSQL y el servicio web Docker desde este repositorio.
# Render → New → Blueprint → elige el repositorio → Apply.
databases:
  - name: datalife-db
    plan: free
    databaseName: datalife
    user: datalife

services:
  - type: web
    name: datalife
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /salud
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: datalife-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ETL_WEBHOOK_TOKEN
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: SEED_DEMO
        value: "1"
      - key: DEMO_PASSWORD
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
